name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Rust unit tests
        working-directory: backend
        run: cargo test --locked
      - name: Build and verify protocol (macOS)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          node scripts/build-backend.mjs darwin
          node scripts/package.mjs --platforms darwin
          node scripts/verify-protocol.mjs
      - name: Build (Linux x64)
        if: runner.os == 'Linux'
        run: |
          node scripts/build-backend.mjs linux-x64
          node scripts/package.mjs --platforms linux-x64
      - name: Build (Windows x64)
        if: runner.os == 'Windows'
        run: node scripts/build-backend.mjs windows-x64

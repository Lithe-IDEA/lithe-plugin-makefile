name: Release

# Push a tag v<version> matching plugin.json to publish a GitHub Release.
# Tags listed in PRERELEASE_TAGS are published as pre-releases so Lithe Store's
# tracker skips them until the companion desktop changes ship.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - platform: darwin
            os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
          - platform: windows-x64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
          - platform: windows-arm64
            os: windows-latest
            targets: aarch64-pc-windows-msvc
          - platform: linux-x64
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust targets
        shell: bash
        run: rustup target add ${{ matrix.targets }}
      - name: Build backend
        run: node scripts/build-backend.mjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.platform }}
          path: .artifacts/backend-${{ matrix.platform }}
          if-no-files-found: error

  release:
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-*
          path: .artifacts
      - name: Package all platforms
        run: |
          set -o pipefail
          node scripts/package.mjs --expect-tag "$GITHUB_REF_NAME" | tee "$RUNNER_TEMP/checksums.txt"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # v0.0.1 uses buildSystems[].run[].configurationType (Lithe-core-rust#196,
          # 1lck/Lithe-IDEA#2382), so publish as a pre-release until a desktop build
          # including those changes ships.
          PRERELEASE_TAGS: v0.0.1
        run: |
          prerelease=false
          for tag in $PRERELEASE_TAGS; do
            if [[ "$tag" == "$GITHUB_REF_NAME" ]]; then prerelease=true; fi
          done
          {
            echo "兼容性：按插件契约 v0（schemaVersion 0、pluginAPIVersion 0）编写，需要包含 Lithe-core-rust#196 与 1lck/Lithe-IDEA#2382 的新版 Lithe 桌面端。"
            echo
            if [[ -s "docs/releases/$GITHUB_REF_NAME.md" ]]; then
              cat "docs/releases/$GITHUB_REF_NAME.md"
              echo
            fi
            if [[ "$prerelease" == true ]]; then
              echo "安装：预发布版本。下载对应平台的 ZIP，在 设置 → 插件 中点击 从文件安装…，选中 ZIP 并确认安装。"
            else
              echo "安装：可在 设置 → 插件 → 插件市场 中搜索 Makefile 安装，或下载对应平台的 ZIP 从文件安装。"
            fi
            echo
            echo "SHA-256："
            echo '```'
            sed 's#^dist/##' "$RUNNER_TEMP/checksums.txt"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          release_flags=()
          if [[ "$prerelease" == true ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Makefile $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" "${release_flags[@]}"
